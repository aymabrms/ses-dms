services:
  postgres:
    image: postgres:17-alpine
    container_name: ses-dms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ses_dms}
      POSTGRES_USER: ${POSTGRES_USER:-ses_dms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ses_dms_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ses_dms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ses_dms_postgres_data:
